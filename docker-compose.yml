version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gold-ai-postgres
    environment:
      POSTGRES_DB: gold_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gold-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-market-ai
    ports:
      - "3141:3141"
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: gold_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LIBSQL_URL: file:/app/.voltagent/memory.db
      VOLTAGENT_PUBLIC_KEY: ${VOLTAGENT_PUBLIC_KEY:-}
      VOLTAGENT_SECRET_KEY: ${VOLTAGENT_SECRET_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      PORT: 3141
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - voltagent_data:/app/.voltagent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3141/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  voltagent_data:
    driver: local
